# ========================================
#  VotingGacha メッセージ設定ファイル
# ========================================
#
# このファイルでプラグインのすべてのメッセージをカスタマイズできます。
# 色コード: & + 色コード（例: &a = 緑, &c = 赤, &e = 黄色）
# 
# 利用可能な色コード:
#   &0=黒  &1=濃い青  &2=濃い緑  &3=濃い水色
#   &4=濃い赤  &5=紫  &6=金  &7=灰色
#   &8=濃い灰色  &9=青  &a=緑  &b=水色
#   &c=赤  &d=ピンク  &e=黄色  &f=白
#
# 装飾コード:
#   &l=太字  &m=取り消し線  &n=下線  &o=斜体  &r=リセット
# ========================================

# ========================================
# 投票関連メッセージ
# ========================================
vote:
  # 投票を受信した時のメッセージ
  received: "&a投票ありがとうございます！ガチャを引いています..."
  
  # ガチャ結果のメッセージ（{item}はアイテム名に置き換えられます）
  result: "&e【ガチャ結果】&f{item} &7を獲得しました！"
  
  # インベントリに空きがない時のメッセージ
  no-space: "&c所持アイテムに空きがありません！"
  
  # ガチャアイテムが設定されていない時のメッセージ
  no-items: "&cガチャアイテムが設定されていません。管理者に連絡してください。"

# ========================================
# コマンドメッセージ
# ========================================
command:
  # 権限がない時のメッセージ
  no-permission: "&cこのコマンドを実行する権限がありません。"
  
  # 設定をリロードした時のメッセージ
  reload-success: "&a設定ファイルをリロードしました。"
  
  # プレイヤーのみ実行可能なコマンドをコンソールから実行した時
  player-only: "&cこのコマンドはプレイヤーのみ実行できます。"

# ========================================
# ヘルプメッセージ
# ========================================
help:
  # ヘルプのヘッダー
  header: "&6===== VotingGacha ヘルプ ====="
  
  # 各コマンドの説明
  gacha: "&e/votinggacha gacha &7- ガチャを引く（テスト用）"
  reload: "&e/votinggacha reload &7- 設定をリロード"
  help: "&e/votinggacha help &7- ヘルプを表示"
