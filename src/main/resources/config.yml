# VotingGacha 設定ファイル
# プレイヤーが投票した時にランダムで貰えるアイテムを設定できます

# メッセージ設定
messages:
  vote-received: "&a投票ありがとうございます！ガチャを引いています..."
  gacha-result: "&e【ガチャ結果】&f{item} &7を獲得しました！"
  no-space: "&c所持アイテムに空きがありません！"
  reload-success: "&a設定ファイルをリロードしました。"
  no-permission: "&cこのコマンドを実行する権限がありません。"
  help-header: "&6===== VotingGacha ヘルプ ====="
  help-gacha: "&e/votinggacha gacha &7- ガチャを引く（テスト用）"
  help-reload: "&e/votinggacha reload &7- 設定をリロード"
  help-help: "&e/votinggacha help &7- ヘルプを表示"

# ガチャアイテム設定
# material: アイテムの種類（Minecraft 1.19.4のアイテムID）
# amount: 個数
# name: アイテムの表示名（オプション）
# lore: アイテムの説明（オプション）
# weight: 排出確率の重み（数値が大きいほど出やすい）
