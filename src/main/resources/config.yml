# ========================================
#  VotingGacha 設定ファイル
# ========================================
#
# このファイルでガチャアイテムの設定を行います。
# メッセージの設定は messages.yml をご確認ください。
#
# 設定を変更した後は以下のコマンドで反映できます：
#   /votinggacha reload
# ========================================

# ========================================
# ガチャアイテム設定
# ========================================
#
# 各アイテムの設定項目:
#   material: アイテムの種類（Minecraft 1.19.4のアイテムID）
#   amount:   個数（1-64）
#   name:     アイテムの表示名（オプション、色コード使用可能）
#   lore:     アイテムの説明文（オプション、複数行可能）
#   weight:   排出確率の重み（数値が大きいほど出やすい）
#
# 排出確率の計算:
#   アイテムの確率 = (そのアイテムのweight / 全アイテムのweight合計) × 100%
#
# 例: weight=1の場合、約0.88%の確率（超レア）
#     weight=10の場合、約8.77%の確率（レア）
#     weight=25の場合、約21.93%の確率（コモン）
# ========================================

